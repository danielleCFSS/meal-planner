<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#5E6B43"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Recipe preview"/>
<title>Recipe preview</title>
<style>html,body{margin:0;padding:0;background:#ECEADF;}
#boot{padding:28px 18px;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#7C7768;}
.diag{padding:18px;font:14px/1.6 system-ui,sans-serif;color:#a33;white-space:pre-wrap;}

.mp{--paper:#ECEADF;--card:#F8F6EE;--ink:#33302A;--muted:#7C7768;--olive:#5E6B43;--clay:#B0633C;--line:#D9D3C4;
  background:var(--paper);color:var(--ink);min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
.rp-wrap{max-width:640px;margin:0 auto;padding:0 18px 64px;}
.rp-banner{margin:14px 0 2px;display:inline-block;font-size:12px;color:var(--olive);background:#EBEBDD;border:1px solid var(--line);padding:4px 10px;border-radius:999px;}
.rp-head{padding:14px 0 6px;}
.rp-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.rp-title{font-family:"Fraunces",Georgia,serif;font-size:30px;line-height:1.08;font-weight:600;margin:4px 0 8px;}
.rp-desc{color:var(--muted);font-size:15px;line-height:1.5;margin:0;}
.rp-controls{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin:16px 0 8px;}
.rp-serves{display:flex;align-items:center;gap:10px;}
.rp-clabel{font-size:14px;color:var(--muted);}
.rp-step{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--olive);
  font-size:20px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.rp-step:active{background:#e3e0d3;}
.rp-count{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:600;min-width:20px;text-align:center;}
.rp-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper);}
.rp-tg{border:none;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:7px 13px;cursor:pointer;}
.rp-tg.on{background:var(--olive);color:#F6F3EA;}
.rp-section{margin-top:18px;}
.rp-aisle{font-family:"Fraunces",Georgia,serif;font-size:16px;font-weight:600;color:var(--olive);margin:0 0 8px;}
.rp-ings{list-style:none;margin:0;padding:0;}
.rp-ing{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline;}
.rp-iamt{font-weight:700;min-width:74px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.rp-iname{color:var(--ink);}
.rp-stepcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:11px;}
.rp-steptop{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.rp-num{width:24px;height:24px;flex-shrink:0;border-radius:999px;background:var(--olive);color:#F6F3EA;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;}
.rp-stitle{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;}
.rp-scontent{margin:0;line-height:1.55;font-size:15px;}
.rp-amt{font-weight:700;background:#EBE7D8;border-radius:5px;padding:0 4px;white-space:nowrap;}
.rp-timer{margin-top:11px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--clay);background:var(--paper);
  color:var(--clay);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;}
.rp-timer:active{background:#efe7df;}
.rp-timer-live{margin-top:11px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--paper);border:1px solid var(--clay);border-radius:11px;padding:9px 13px;}
.rp-tclock{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px;color:var(--clay);font-variant-numeric:tabular-nums;}
.rp-timer-done{border-color:var(--olive);color:var(--olive);font-weight:600;justify-content:space-between;}
.rp-tlink{border:none;background:transparent;font:inherit;font-weight:600;font-size:14px;color:var(--olive);cursor:pointer;padding:2px 4px;text-decoration:underline;}
.rp-notes{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:6px 14px;}
.rp-note{margin:10px 0;line-height:1.55;font-size:14px;color:var(--ink);}
.rp-foot{margin-top:22px;text-align:center;color:var(--muted);font-size:13px;}

</style>
